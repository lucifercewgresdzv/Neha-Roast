<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Open If You Dare 💌</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;
}

.title{
font-size:32px;
font-weight:700;
color:#ff4f93;
margin-bottom:40px;
text-align:center;
}

.envelope{

position:relative;
width:300px;
height:190px;
cursor:pointer;
transition:.5s;

}

.base{

position:absolute;
bottom:0;
width:100%;
height:120px;
background:#ff8fb8;
border-radius:0 0 18px 18px;
}

.flap{

position:absolute;
top:0;
width:100%;
height:110px;
background:#ff6da5;
clip-path:polygon(0 0,100% 0,50% 100%);
transform-origin:top;
transition:1s;
z-index:5;

}

.letter{

position:absolute;
left:20px;
top:40px;
width:260px;
height:150px;
background:white;
border-radius:12px;
padding:18px;
text-align:center;
transition:1s;
z-index:2;
box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.letter h2{
color:#ff5b9b;
margin-bottom:12px;
}

.letter p{
font-size:16px;
line-height:1.6;
color:#555;
}

.open .flap{

transform:rotateX(180deg);

}

.open .letter{

transform:translateY(-120px);

}

.next{

margin-top:60px;
display:none;
padding:16px 40px;
border:none;
border-radius:50px;
background:#ff5b9b;
color:white;
font-size:18px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="bg"></div>

<div id="hearts"></div>

<div class="title">

💌 Tap the Envelope 💌

</div>

<div class="envelope" id="env">

<div class="flap"></div>

<div class="base"></div>

<div class="letter">

<h2>Dear Neha 😂</h2>

<p>

You still decided to continue...

That means you officially accepted

the upcoming roast.

No refunds.

😌

</p>

</div>

</div>

<button class="next" id="nextBtn">

Continue ➜

</button>

<script>

const hearts=document.getElementById("hearts");

const emojis=["💖","💕","🌸","✨"];

function heart(){

const h=document.createElement("span");

h.className="heart";

h.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(4+Math.random()*4)+"s";

h.style.fontSize=(18+Math.random()*20)+"px";

hearts.appendChild(h);

setTimeout(()=>h.remove(),8000);

}

setInterval(heart,350);

const env=document.getElementById("env");
const next=document.getElementById("nextBtn");

env.onclick=()=>{

env.classList.add("open");

setTimeout(()=>{

next.style.display="block";

},1200);

};

next.onclick=()=>{

window.location.href="gallery.html";

};

</script>

</body>
</html>
