<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mission Complete 🎉</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.card{
max-width:520px;
}

h1{
font-size:42px;
color:#ff4f93;
margin-bottom:20px;
}

p{
font-size:20px;
line-height:1.8;
color:#555;
}

button{
margin-top:30px;
}

.confetti{
position:fixed;
top:-20px;
font-size:24px;
pointer-events:none;
animation:fall linear forwards;
}

@keyframes fall{

0%{
transform:translateY(-20px) rotate(0deg);
opacity:1;
}

100%{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}

}

</style>

</head>

<body>

<div class="bg"></div>

<div id="hearts"></div>

<div class="card">

<div class="emoji">🏆</div>

<h1>Roast Complete 😂</h1>

<p>

Congratulations, Neha! 🎉

You survived the roast...

Barely. 😌

<br><br>

📏 Height:
Still loading...

<br>

😤 Attitude:
1000/10

<br>

😂 Drama:
Unlimited

<br><br>

Thanks for being such a fun friend to tease.
(Just don't plan your revenge too soon. 😅)

</p>

<button onclick="restart()">

Watch Again 💖

</button>

</div>

<script>

// Restart
function restart(){

window.location.href="index.html";

}

// Hearts

const hearts=document.getElementById("hearts");

const emojis=["💖","💕","🌸","✨"];

function heart(){

const h=document.createElement("span");

h.className="heart";

h.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(4+Math.random()*4)+"s";

h.style.fontSize=(18+Math.random()*20)+"px";

hearts.appendChild(h);

setTimeout(()=>h.remove(),8000);

}

setInterval(heart,350);

// Confetti

const confettiEmoji=["🎉","✨","💖","🌸","🎀","🎊"];

function confetti(){

const c=document.createElement("span");

c.className="confetti";

c.innerHTML=confettiEmoji[Math.floor(Math.random()*confettiEmoji.length)];

c.style.left=Math.random()*100+"vw";

c.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(c);

setTimeout(()=>c.remove(),6000);

}

setInterval(confetti,180);

</script>

</body>
</html>
