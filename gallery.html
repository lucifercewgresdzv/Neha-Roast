<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neha Roast 😂</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.card{

max-width:430px;

}

img{

width:100%;
height:420px;

object-fit:cover;

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.2);

margin-bottom:25px;

transition:.5s;

}

#message{

font-size:22px;

font-weight:bold;

line-height:1.6;

color:#ff4f93;

min-height:140px;

}

button{

margin-top:25px;

}

</style>

</head>

<body>

<div class="bg"></div>

<div id="hearts"></div>

<div class="card">

<img id="photo" src="images/neha1.jpg">

<div id="message">

Loading Roast...

</div>

<button id="next">

Next ➜

</button>

</div>

<script>

const photos=[

"images/neha1.jpg",
"images/neha2.jpg",
"images/neha3.jpg",
"images/neha4.jpg"

];

const roasts=[

`😂 Height Status

██████░░░░

Error...

Height Not Found.

`,

`📊 System Report

Height

█░░░░░░░░░

Attitude

██████████

`,

`Scientists finally discovered

where your height went...

It was converted

into confidence. 😌`,

`Okay...

Jokes aside. ❤️

This picture is actually cute.

(Don't get used to compliments. 😂)

Thanks for all the random arguments,

the teasing,

the reels,

and the memories.

Stay the same crazy person.

— Ayan 🤍`

];

let i=0;

const img=document.getElementById("photo");

const msg=document.getElementById("message");

document.getElementById("next").onclick=()=>{

i++;

if(i>=photos.length){

window.location.href="ending.html";

return;

}

img.style.opacity=0;

setTimeout(()=>{

img.src=photos[i];

msg.innerHTML=roasts[i];

img.style.opacity=1;

},300);

};

msg.innerHTML=roasts[0];


// Hearts

const hearts=document.getElementById("hearts");

const emojis=["💖","🌸","💕","✨"];

function heart(){

const h=document.createElement("span");

h.className="heart";

h.innerHTML=emojis[Math.floor(Math.random()*4)];

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(4+Math.random()*4)+"s";

h.style.fontSize=(18+Math.random()*20)+"px";

hearts.appendChild(h);

setTimeout(()=>h.remove(),8000);

}

setInterval(heart,350);

</script>

</body>

</html>
