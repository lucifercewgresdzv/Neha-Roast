<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Question 👀</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{

overflow:hidden;

}

.card{

max-width:500px;

}

.question{

font-size:30px;

font-weight:700;

color:#ff4f93;

margin-bottom:25px;

line-height:1.5;

}

.buttons{

position:relative;

height:220px;

margin-top:30px;

}

.btn{

position:absolute;

padding:16px 40px;

border:none;

border-radius:50px;

font-size:20px;

font-weight:bold;

cursor:pointer;

transition:.25s;

box-shadow:0 10px 25px rgba(0,0,0,.15);

}

#yes{

left:50%;

transform:translateX(-50%);

bottom:20px;

background:#ff5fa2;

color:white;

}

#no{

left:50px;

top:20px;

background:white;

color:#ff4f93;

border:2px solid #ff4f93;

}

.tip{

margin-top:20px;

font-size:16px;

color:#666;

}

</style>

</head>

<body>

<div class="bg"></div>

<div id="hearts"></div>

<div class="card">

<div class="emoji">🤭</div>

<div class="question">

⚠️ This website contains content that may hurt your ego.

<br><br>

Do you still want to continue?

</div>

<div class="buttons">

<button id="yes" class="btn">
YES 💖
</button>

<button id="no" class="btn">
NO 🙄
</button>

</div>

<p class="tip">

Try clicking <b>NO</b>... 😏

</p>

</div>

<script src="js/question.js"></script>

</body>
</html>
